name: gerar-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash setup.sh
      - name: Preparar chave de assinatura
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias ofertas -keyalg RSA -keysize 2048 -validity 10000 -storepass ofertas123 -keypass ofertas123 -dname "CN=Phillip Almeida, O=Ofertas, C=BR"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chave de assinatura [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
